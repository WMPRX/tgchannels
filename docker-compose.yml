version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tgchannels_db
    environment:
      POSTGRES_USER: tgchannels
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tgchannels
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tgchannels']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tgchannels_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: node:22-alpine
    container_name: tgchannels_migrate
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://tgchannels:password@postgres:5432/tgchannels
    command: >
      sh -c "npm install -g pnpm &&
             pnpm install --frozen-lockfile &&
             node node_modules/.bin/prisma migrate deploy &&
             node node_modules/.bin/ts-node --compiler-options '{\"module\":\"CommonJS\"}' prisma/seed.ts || true"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXTAUTH_SECRET=tgchannels-docker-secret-change-in-production
    container_name: tgchannels_app
    ports:
      - '3000:3000'
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
